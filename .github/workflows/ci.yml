name: Attendance App CI

on:
  push:
    branches: [main, readiness/attendance-safety]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Check Python syntax
        run: python -m py_compile main.py
